# Safety net for nse-alerts: a SEPARATE workflow file = a second, independent
# schedule registration (missing-morning-runs issue affects one registration,
# this one backstops it). Hourly across BOTH sessions: ~16 runs/day.
# Same app + SAME concurrency group (repo-wide lock) + branch-shared state cache
#  -> runs serialize with nse-alerts and share state.json, so dedupe guarantees
#     no double alerts even when both fire at the same minute.
name: nse-alerts-safety

on:
  schedule:
    - cron: '15 3-17 * * 1-5'      # hourly 08:45-22:45 IST (NSE + MCX)
    - cron: '15 18 * * 1-5'        # final daily tick 23:45 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nse-alerts               # repo-wide: shared with nse-alerts.yml
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nse_alerter/requirements-cloud.txt

      # Restore and append to the same India-date log used by nse-alerts.yml.
      - name: Resolve India trading date
        id: log_date
        run: echo "ist_date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: nse_alerter/daily.log
          key: nse-log-${{ steps.log_date.outputs.ist_date }}-${{ github.run_id }}
          restore-keys: nse-log-${{ steps.log_date.outputs.ist_date }}-

      - uses: actions/cache@v4
        with:
          path: nse_alerter/state.json
          key: nse-state-${{ github.run_id }}
          restore-keys: |
            nse-state-

      - name: Install dependencies
        run: pip install -r nse_alerter/requirements-cloud.txt

      - name: Evaluate signal and notify
        run: python nse_alerter/main.py --verbose 2>&1 | tee -a nse_alerter/daily.log
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: ${{ github.workspace }}/nse_alerter/state.json
          DATA_PROVIDER: kite
          # Zerodha Kite (requires paid Kite Connect plan; token rotates daily)
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          STRATEGY: ${{ vars.STRATEGY || 'qqe' }}
          PREP_EMA_BUFFER_PCT: ${{ vars.PREP_EMA_BUFFER_PCT || '0.02' }}
          PREP_QQE_BUFFER: ${{ vars.PREP_QQE_BUFFER || '1.0' }}
          SYMBOLS: ${{ vars.SYMBOLS || 'NIFTY1!~qqe,NIFTY1!~both,MCX:CRUDEOIL~qqe@17:00-22:00,MCX:CRUDEOIL~both@17:00-22:00' }}
          HOLIDAYS: ${{ vars.HOLIDAYS || '2026-01-15,2026-01-26,2026-03-03,2026-03-26,2026-03-31,2026-04-03,2026-04-14,2026-05-01,2026-05-28,2026-06-26,2026-09-14,2026-10-02,2026-10-20,2026-11-10,2026-11-24,2026-12-25' }}

      - name: Redact credentials from daily log
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("nse_alerter/daily.log")
          if path.exists():
              text = path.read_text(encoding="utf-8")
              for name in ("TELEGRAM_BOT_TOKEN", "KITE_API_KEY", "KITE_ACCESS_TOKEN"):
                  secret = os.environ.get(name, "")
                  if secret:
                      text = text.replace(secret, "[REDACTED]")
              text = re.sub(r"(?i)(/bot)\d{8,}:[A-Za-z0-9_-]{20,}", r"\1[REDACTED]", text)
              path.write_text(text, encoding="utf-8")
          PY

      # This final weekday safety run is at 23:45 IST; publish one log for the day.
      - name: Upload daily trading log
        if: always() && github.event_name == 'schedule' && github.event.schedule == '15 18 * * 1-5'
        uses: actions/upload-artifact@v4
        with:
          name: nse-alerts-log-${{ steps.log_date.outputs.ist_date }}
          path: nse_alerter/daily.log
          if-no-files-found: error
          retention-days: 30
