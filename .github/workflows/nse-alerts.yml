# Runs the SAME nse_alerter app on GitHub's servers - your PC can stay off.
# Cron is UTC; IST has no DST -> sessions: MCX 09:00-23:35, NSE 09:15-15:35 IST.
# Simple syntax only (minute lists + one */5 hour range), Mon-Fri:
#   09:02-09:27, 09:32-23:27, 23:32-23:37 IST every 5 min = ~176 runs/day
# (free minutes: make the repo PUBLIC for unlimited Actions minutes)
# Runs land ~2 min into each FORMING 5m bar (not on the :00/:05 boundaries),
# so the forming-bar "flip PENDING" heads-up (PREP_ALERTS) fires BEFORE the
# confirmed full-bar alert - you hear about a cross while the bar is forming.
name: nse-alerts

on:
  schedule:
    - cron: '32,37,42,47,52,57 3 * * 1-5'   # 09:02-09:27 IST (MCX open)
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 4-17 * * 1-5'  # 09:32-23:27
    - cron: '2,7 18 * * 1-5'                # 23:32-23:37 IST (MCX close grace)
    - cron: '15,20,25 3 * * 1-5'            # 08:45-08:55 IST pre-open quiet ticks
  workflow_dispatch:            # manual "Run workflow" button for testing

permissions:
  contents: read

concurrency:
  group: nse-alerts             # never run two evaluations at once
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nse_alerter/requirements-cloud.txt

      # Daily logs must survive the short-lived GitHub runner between ticks.
      - name: Resolve India trading date
        id: log_date
        run: echo "ist_date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: nse_alerter/daily.log
          key: nse-log-${{ steps.log_date.outputs.ist_date }}-${{ github.run_id }}
          restore-keys: nse-log-${{ steps.log_date.outputs.ist_date }}-

      # Dedupe state survives across runs (restore latest, save fresh each time).
      # A cache miss is self-healing: the app records a silent baseline instead
      # of double-alerting (worst case: one cross during the gap is skipped).
      - uses: actions/cache@v4
        with:
          path: nse_alerter/state.json
          key: nse-state-${{ github.run_id }}
          restore-keys: |
            nse-state-

      - name: Install dependencies
        run: pip install -r nse_alerter/requirements-cloud.txt

      - name: Evaluate signal and notify
        run: python nse_alerter/main.py --verbose 2>&1 | tee -a nse_alerter/daily.log
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: ${{ github.workspace }}/nse_alerter/state.json
          DATA_PROVIDER: kite
          # Zerodha Kite (requires paid Kite Connect plan; token rotates daily)
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          # Toggle strategies from repo Settings > Secrets and variables >
          # Actions > Variables: STRATEGY = qqe | ema20 | both (default qqe)
          STRATEGY: ${{ vars.STRATEGY || 'qqe' }}
          PREP_EMA_BUFFER_PCT: ${{ vars.PREP_EMA_BUFFER_PCT || '0.02' }}
          PREP_QQE_BUFFER: ${{ vars.PREP_QQE_BUFFER || '1.0' }}
          # Watch list (entry: SYM[~strategy][@HH:MM-HH:MM alert window][>proxy]):
          SYMBOLS: ${{ vars.SYMBOLS || 'NIFTY1!~qqe,NIFTY1!~both,MCX:CRUDEOIL~qqe@17:00-22:00,MCX:CRUDEOIL~both@17:00-22:00' }}
          # 2026 NSE/BSE exchange holidays (repo Variable HOLIDAYS overrides):
          HOLIDAYS: ${{ vars.HOLIDAYS || '2026-01-15,2026-01-26,2026-03-03,2026-03-26,2026-03-31,2026-04-03,2026-04-14,2026-05-01,2026-05-28,2026-06-26,2026-09-14,2026-10-02,2026-10-20,2026-11-10,2026-11-24,2026-12-25' }}

      - name: Redact credentials from daily log
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("nse_alerter/daily.log")
          if path.exists():
              text = path.read_text(encoding="utf-8")
              for name in ("TELEGRAM_BOT_TOKEN", "KITE_API_KEY", "KITE_ACCESS_TOKEN"):
                  secret = os.environ.get(name, "")
                  if secret:
                      text = text.replace(secret, "[REDACTED]")
              text = re.sub(r"(?i)(/bot)\d{8,}:[A-Za-z0-9_-]{20,}", r"\1[REDACTED]", text)
              path.write_text(text, encoding="utf-8")
          PY
